# ============================================================
# Docker Compose — FinTech Sales Intelligence
# ============================================================
services:
  # ---- FastAPI Application ----
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fintech-app
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-fintech}:${POSTGRES_PASSWORD:-fintech_secret}@postgres:5432/${POSTGRES_DB:-fintech_sales}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.presentation.api.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - fintech-network

  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: fintech-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fintech_sales}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintech} -d ${POSTGRES_DB:-fintech_sales}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fintech-network

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: fintech-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fintech-network

  # ---- pgAdmin (Development Only) ----
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fintech-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fintech.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - fintech-network
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:

networks:
  fintech-network:
    driver: bridge
