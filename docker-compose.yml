# ============================================================
# Docker Compose — FinTech Sales Intelligence
# ============================================================
services:
  # ---- FastAPI Application ----
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fintech-app
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+asyncmy://${MYSQL_USER:-fintech}:${MYSQL_PASSWORD:-fintech_secret}@mysql:3306/${MYSQL_DB:-fintech_sales}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - MYSQL_HOST=mysql
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.presentation.api.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - fintech-network

  # ---- MySQL ----
  mysql:
    image: mysql:8.0
    container_name: fintech-mysql
    environment:
      MYSQL_USER: ${MYSQL_USER:-fintech}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fintech_secret}
      MYSQL_DATABASE: ${MYSQL_DB:-fintech_sales}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u ${MYSQL_USER:-fintech} -p${MYSQL_PASSWORD:-fintech_secret}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fintech-network

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: fintech-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fintech-network

  # ---- Adminer (Development Only) ----
  adminer:
    image: adminer:latest
    container_name: fintech-adminer
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - fintech-network
    profiles:
      - dev

volumes:
  mysql_data:
  redis_data:

networks:
  fintech-network:
    driver: bridge
