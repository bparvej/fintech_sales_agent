services:
  - type: web
    name: fintech-sales-intelligence
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: docker/Dockerfile
    buildCommand: ""
    startCommand: "uvicorn app.presentation.api.main:create_app --factory --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        scope: secret
      - key: MYSQL_USER
        scope: secret
      - key: MYSQL_PASSWORD
        scope: secret
      - key: MYSQL_DB
        scope: secret
      - key: MYSQL_HOST
        scope: secret
      - key: MYSQL_PORT
        scope: secret
      - key: REDIS_URL
        scope: secret
      - key: SECRET_KEY
        scope: secret
      - key: DB_INIT
        value: "true"
        scope: private
    autoDeploy: true
    branch: main
